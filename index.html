<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>اخترعها! | Invent It! — لعبة الحفلات العائلية الكوميدية</title>
  <meta name="description" content="لعبة الحفلات والعائلة الممتعة والكوميدية - اخترع أغرب المنتجات وسوّقها وكأنك بائع تلفزيون واكسب أصوات العائلة!" />
  <meta name="theme-color" content="#F97316" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables & Theme */
    :root {
      --font-ar: 'Cairo', system-ui, -apple-system, sans-serif;
      --font-en: 'Outfit', system-ui, -apple-system, sans-serif;
      
      --bg-page: #FFFBF5;
      --bg-card: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-input: #F1F5F9;
      --border: #E2E8F0;
      --border-focus: #F97316;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-light: #94A3B8;

      --primary: #F97316;
      --primary-hover: #EA580C;
      --primary-light: #FFF7ED;
      --primary-border: #FFEDD5;
      
      --accent: #EAB308;
      --teal: #0D9488;
      --teal-light: #F0FDFA;
      --rose: #E11D48;
      --rose-light: #FFF1F2;
      
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    html.dark {
      --bg-page: #0B0F19;
      --bg-card: #131B2E;
      --bg-subtle: #1A243B;
      --bg-input: #1E293B;
      --border: #243049;
      --border-focus: #FB923C;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-light: #64748B;

      --primary: #FB923C;
      --primary-hover: #F97316;
      --primary-light: #2A1C12;
      --primary-border: #43281C;

      --teal-light: #0F2D2A;
      --rose-light: #31131E;

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-ar);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    html[dir="ltr"] body {
      font-family: var(--font-en);
    }

    a, button {
      font-family: inherit;
      cursor: pointer;
    }

    /* Container */
    .container {
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Navigation Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
      transition: background-color 0.2s, border-color 0.2s;
    }
    .nav-inner {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #F97316, #EAB308);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 2px 4px rgba(249, 115, 22, 0.3);
    }
    .brand-text {
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(90deg, #EA580C, #F59E0B);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 8px;
      transition: color 0.15s, background-color 0.15s;
    }
    .nav-btn:hover, .nav-btn.active {
      color: var(--primary);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.15s;
    }
    .icon-btn:hover {
      background: var(--bg-card);
      border-color: var(--primary);
    }
    .cta-btn-sm {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      background: linear-gradient(90deg, #F97316, #EA580C);
      color: #fff;
      border: none;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 2px 4px rgba(249, 115, 22, 0.3);
      transition: transform 0.1s, opacity 0.15s;
    }
    .cta-btn-sm:active {
      transform: scale(0.96);
    }

    /* Main Area */
    main {
      flex: 1;
      padding: 24px 0 48px;
    }

    /* Common Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 800;
      border: none;
      transition: all 0.15s;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(90deg, #F97316, #EA580C);
      color: #fff;
      box-shadow: 0 4px 10px rgba(249, 115, 22, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(90deg, #EA580C, #C2410C);
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      border-color: var(--primary);
      background: var(--bg-subtle);
    }
    .btn-block {
      width: 100%;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Cards & Layout */
    .box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      transition: background-color 0.2s, border-color 0.2s;
    }
    @media (max-width: 640px) {
      .box {
        padding: 18px;
        border-radius: var(--radius-md);
      }
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 24px 0 40px;
    }
    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .hero-title {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 16px;
      color: var(--text-main);
    }
    .hero-highlight {
      background: linear-gradient(90deg, #F97316, #EAB308);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: underline wavy #FDBA74 2px;
    }
    .hero-desc {
      font-size: clamp(15px, 2.5vw, 18px);
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto 24px;
      line-height: 1.7;
    }
    .hero-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .hero-meta span.dot {
      color: var(--border);
    }
    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* 3D Game Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }
    .game-card {
      border-radius: var(--radius-md);
      padding: 20px;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid;
      position: relative;
      user-select: none;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .game-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }
    .card-problem {
      background: linear-gradient(135deg, #FFF1F2 0%, #FFF7ED 100%);
      border-color: #FECDD3;
    }
    html.dark .card-problem {
      background: linear-gradient(135deg, #241419 0%, #1A1829 100%);
      border-color: #881337;
    }
    .card-ingredient {
      background: linear-gradient(135deg, #F0FDFA 0%, #EFF6FF 100%);
      border-color: #CCFBF1;
    }
    html.dark .card-ingredient {
      background: linear-gradient(135deg, #0C211F 0%, #141B2D 100%);
      border-color: #115E59;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      padding-bottom: 10px;
    }
    html.dark .card-header {
      border-bottom-color: rgba(255,255,255,0.06);
    }
    .card-badge {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-problem .card-badge { color: var(--rose); }
    .card-ingredient .card-badge { color: var(--teal); }
    .card-text {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.5;
      margin: 12px 0;
      color: var(--text-main);
    }
    .card-subtext {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-light);
      font-weight: 700;
      border-top: 1px solid rgba(0,0,0,0.06);
      padding-top: 8px;
    }
    html.dark .card-footer {
      border-top-color: rgba(255,255,255,0.06);
    }

    /* Lobby Styling */
    .lobby-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    @media (min-width: 860px) {
      .lobby-grid {
        grid-template-columns: 7fr 5fr;
      }
    }
    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .player-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: var(--primary-light);
    }
    .player-name {
      font-weight: 800;
      font-size: 15px;
    }
    .del-btn {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 16px;
      padding: 6px;
      border-radius: 6px;
    }
    .del-btn:hover {
      color: var(--rose);
      background: var(--rose-light);
    }

    /* Forms */
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-input, .form-textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus, .form-textarea:focus {
      border-color: var(--border-focus);
      background: var(--bg-card);
    }
    .pill-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill-btn {
      flex: 1;
      min-width: 70px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .pill-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Pitch Studio */
    .pitch-stage {
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--primary-light) 100%);
      border: 2px solid var(--primary-border);
      border-radius: var(--radius-lg);
      padding: 28px;
      text-align: center;
      position: relative;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #FEE2E2;
      color: #DC2626;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #DC2626;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }
    .cue-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      margin: 20px 0;
      box-shadow: var(--shadow-sm);
    }
    .cue-title {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .cue-slogan {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      font-style: italic;
      margin-bottom: 12px;
    }
    .cue-price {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 9999px;
      background: var(--teal-light);
      color: var(--teal);
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 12px;
    }
    .soundboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .sound-btn {
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      transition: all 0.1s;
    }
    .sound-btn:active {
      transform: scale(0.95);
      background: var(--primary-light);
    }

    /* Voting Screen */
    .vote-card {
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      background: var(--bg-card);
      cursor: pointer;
      transition: all 0.15s;
    }
    .vote-card:hover {
      border-color: var(--primary);
    }
    .vote-card.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      box-shadow: 0 0 0 2px var(--primary);
    }
    .vote-card.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--border) !important;
      background: var(--bg-subtle) !important;
    }

    /* Timer Widget */
    .timer-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 9999px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      font-family: monospace;
      font-size: 20px;
      font-weight: 900;
      color: var(--text-main);
    }
    .timer-badge.urgent {
      background: var(--rose-light);
      color: var(--rose);
      border-color: var(--rose);
      animation: pulse 0.5s infinite;
    }

    /* Podium */
    .podium {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 12px;
      margin: 32px 0 24px;
    }
    .podium-step {
      flex: 1;
      max-width: 140px;
      text-align: center;
    }
    .podium-box {
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 8px;
      font-weight: 900;
      color: #fff;
    }
    .step-1 { height: 160px; background: linear-gradient(180deg, #F59E0B, #D97706); }
    .step-2 { height: 120px; background: linear-gradient(180deg, #94A3B8, #64748B); }
    .step-3 { height: 90px; background: linear-gradient(180deg, #B45309, #78350F); }

    /* Confetti Canvas */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    /* Utility */
    .text-center { text-align: center; }
    .mt-4 { margin-top: 16px; }
    .mb-4 { margin-bottom: 16px; }
    .gap-4 { gap: 16px; }
    .flex-center { display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <!-- Canvas for celebration confetti -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Navigation -->
  <header>
    <div class="container nav-inner">
      <button class="brand" onclick="navigateTo('landing')">
        <div class="brand-icon">💡</div>
        <span class="brand-text" id="navBrandText">اخترعها!</span>
      </button>

      <nav class="nav-links">
        <button class="nav-btn" onclick="navigateTo('landing')" id="navHowTo">طريقة اللعب</button>
        <button class="nav-btn" onclick="navigateTo('rules')" id="navRules">أسرار البيع</button>
        <button class="nav-btn" onclick="navigateTo('gallery')" id="navGallery">معرض الافتكاسات</button>
        <button class="nav-btn" onclick="navigateTo('custom_cards')" id="navCustom">كروت العيلة</button>
      </nav>

      <div class="nav-actions">
        <!-- Sound Toggle -->
        <button class="icon-btn" onclick="toggleSound()" id="soundBtn" title="كتم / تشغيل الصوت">🔊</button>
        <!-- Theme Toggle -->
        <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="الوضع الليلي / الفاتح">🌙</button>
        <!-- Language Toggle -->
        <button class="icon-btn" onclick="toggleLanguage()" id="langBtn" title="تغيير اللغة">EN</button>
        <!-- Play CTA -->
        <button class="cta-btn-sm" onclick="navigateTo('lobby')" id="navPlayBtn">يلا نلعب!</button>
      </div>
    </div>
  </header>

  <!-- App Main Content Views -->
  <main class="container" id="appRoot">
    <!-- View will be rendered dynamically by JavaScript -->
  </main>

  <script>
    /* =====================================================================
       1. GAME DATA: EGYPTIAN DIALECT CARDS (45+ Problems, 65+ Ingredients)
       ===================================================================== */
    const PROBLEM_CARDS = [
      { id: 'p1', ar: 'الشرابات دايماً فردة بتضيع والتانية قاعدة تعيط لوحدها في الدرج!', en: 'One sock always disappears leaving the other crying alone in the drawer!', icon: '🧦' },
      { id: 'p2', ar: 'الساندوتش دايماً بيقع على الناحية اللي فيها الجبنة والشيكولاتة!', en: 'The sandwich always lands face down on the cheese side!', icon: '🥪' },
      { id: 'p3', ar: 'المنبه بيرن وأنا نايم في أحلى حلم ومش راضي يسكت!', en: 'The alarm rings right during the best dream and refuses to shut up!', icon: '⏰' },

    /* =====================================================================
       2. WEB AUDIO API SYNTHESIZER (100% Offline, Zero external files)
       ===================================================================== */
    let audioCtx = null;
    let isSoundOn = true;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, duration, type = 'sine', gainVal = 0.2) {
      if (!isSoundOn) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(gainVal, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.05);
    }

    function soundFlip() {
      playTone(280, 0.1, 'sine', 0.15);
    }

    function soundTick() {
      playTone(600, 0.04, 'triangle', 0.1);
    }

    function soundUrgent() {
      playTone(900, 0.08, 'sine', 0.2);
    }

    function soundGong() {
      if (!isSoundOn) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      [320, 440, 580].forEach((f, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(f, now + i * 0.04);
        gain.gain.setValueAtTime(0.2, now + i * 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.04);
        osc.stop(now + 0.8);
      });
    }

    function soundCash() {
      if (!isSoundOn) return;
      playTone(987, 0.25, 'sine', 0.2);
      setTimeout(() => playTone(1318, 0.4, 'sine', 0.25), 90);
    }

    function soundBoing() {
      if (!isSoundOn) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.15);
      osc.frequency.exponentialRampToValueAtTime(240, now + 0.3);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.36);
    }

    function soundApplause() {
      if (!isSoundOn) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const bufferSize = ctx.sampleRate * 0.8;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1100, now);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + 0.85);
    }

    function soundFanfare() {
      if (!isSoundOn) return;
      const chords = [523.25, 659.25, 783.99, 1046.50];
      chords.forEach((note, idx) => {
        setTimeout(() => playTone(note, 0.35, 'triangle', 0.2), idx * 130);
      });
    }

    /* =====================================================================
       3. STANDALONE CONFETTI ENGINE (HTML5 Canvas, Zero dependencies)
       ===================================================================== */
    let confettiAnimationId = null;
    function triggerConfetti(durationSeconds = 3) {
      const canvas = document.getElementById('confettiCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#F97316', '#EAB308', '#0D9488', '#EC4899', '#3B82F6', '#8B5CF6'];

      for (let i = 0; i < 120; i++) {
        particles.push({
          x: canvas.width * 0.5,
          y: canvas.height * 0.5,
          vx: (Math.random() - 0.5) * 22,
          vy: (Math.random() - 0.7) * 22,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vrot: (Math.random() - 0.5) * 12,
          alpha: 1
        });
      }

      const start = Date.now();
      if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);

      function frame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const elapsed = (Date.now() - start) / 1000;

        for (let p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.4; // gravity
          p.rotation += p.vrot;
          if (elapsed > durationSeconds - 1) {
            p.alpha -= 0.03;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        }

        if (elapsed < durationSeconds) {
          confettiAnimationId = requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      frame();
    }

    /* =====================================================================
       6. CORE GAME LOGIC & HELPERS
       ===================================================================== */
    function getAllProblems() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE.CUSTOM_PROBLEMS) || '[]');
        return [...PROBLEM_CARDS, ...stored];
      } catch (_) {
        return PROBLEM_CARDS;
      }
    }

    function getAllIngredients() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE.CUSTOM_INGREDIENTS) || '[]');
        return [...INGREDIENT_CARDS, ...stored];
      } catch (_) {
        return INGREDIENT_CARDS;
      }
    }

    function startNewGame() {
      if (gameState.players.length < 3) {
        alert(gameState.language === 'ar' ? 'محتاجين 3 لاعبين على الأقل عشان التصويت والضحك يظبط!' : 'Please add at least 3 players!');
        return;
      }
      soundFanfare();
      gameState.players.forEach(p => p.score = 0);
      gameState.currentRound = 1;
      gameState.roundWinners = [];
      dealRoundCards();
      startInventingPhase();
    }

    function dealRoundCards() {
      const pList = getAllProblems();
      const iList = getAllIngredients();
      gameState.roundProblem = pList[Math.floor(Math.random() * pList.length)];

      const shuffled = [...iList].sort(() => 0.5 - Math.random());
      gameState.roundIngredients = [shuffled[0], shuffled[1]];
      gameState.inventions = [];
    }

    function startInventingPhase() {
      gameState.activePlayerIndex = 0;
      gameState.currentView = 'inventing';
      render();
    }

    function submitPlayerInvention() {
      const nameInput = document.getElementById('invName');
      const sloganInput = document.getElementById('invSlogan');
      const priceInput = document.getElementById('invPrice');
      const featureInput = document.getElementById('invFeatures');

      const name = (nameInput ? nameInput.value.trim() : '') || (gameState.language === 'ar' ? 'الفنكوش السحري 3000' : 'Secret Contraption');
      const slogan = (sloganInput ? sloganInput.value.trim() : '') || (gameState.language === 'ar' ? 'هتدعيلي طول عمرك!' : 'Guaranteed to work!');
      const price = (priceInput ? priceInput.value.trim() : '') || (gameState.language === 'ar' ? '99 جنيه وشكراً' : '$19.99');
      const features = (featureInput ? featureInput.value.trim() : '') || (gameState.language === 'ar' ? 'بيحل المشكلة بالحب والمكونات العجيبة!' : 'Miraculously solves the problem!');

      const curPlayer = gameState.players[gameState.activePlayerIndex];

      gameState.inventions.push({
        id: 'inv_' + Date.now() + '_' + curPlayer.id,
        playerId: curPlayer.id,
        playerName: curPlayer.name,
        playerAvatar: curPlayer.avatar,
        name,
        slogan,
        price,
        features,
        votes: 0
      });

      soundCash();

      if (gameState.activePlayerIndex < gameState.players.length - 1) {
        gameState.activePlayerIndex++;
        render();
      } else {
        // All drafted! Go to Pitch
        gameState.activePitchIndex = 0;
        gameState.pitchTimer = gameState.inventTime;
        gameState.currentView = 'pitch';
        render();
      }
    }

    function startPitchTimer() {
      clearInterval(gameState.pitchInterval);
      soundBoing();
      gameState.pitchInterval = setInterval(() => {
        if (gameState.pitchTimer > 0) {
          gameState.pitchTimer--;
          const el = document.getElementById('pitchTimerText');
          if (el) el.innerText = gameState.pitchTimer + 's';
          if (gameState.pitchTimer <= 5) soundUrgent();
        } else {
          clearInterval(gameState.pitchInterval);
          soundGong();
        }
      }, 1000);
    }

    function nextPitcher() {
      soundFlip();
      clearInterval(gameState.pitchInterval);
      gameState.pitchTimer = gameState.inventTime;
      if (gameState.activePitchIndex < gameState.inventions.length - 1) {
        gameState.activePitchIndex++;
        render();
      } else {
        // Go to voting
        gameState.activeVoterIndex = 0;
        gameState.selectedVoteId = null;
        gameState.votesMap = {};
        gameState.currentView = 'voting';
        render();
      }
    }

    function castVote() {
      if (!gameState.selectedVoteId) {
        alert(gameState.language === 'ar' ? 'اختار اختراع الأول يا معلم!' : 'Please select an invention first!');
        return;
      }
      soundCash();
      const voter = gameState.players[gameState.activeVoterIndex];
      gameState.votesMap[voter.id] = gameState.selectedVoteId;
      gameState.selectedVoteId = null;

      if (gameState.activeVoterIndex < gameState.players.length - 1) {
        gameState.activeVoterIndex++;
        render();
      } else {
        // Tallied! Calculate votes
        gameState.inventions.forEach(inv => inv.votes = 0);
        Object.values(gameState.votesMap).forEach(votedId => {
          const target = gameState.inventions.find(i => i.id === votedId);
          if (target) {
            target.votes++;
            const player = gameState.players.find(p => p.id === target.playerId);
            if (player) player.score++;
          }
        });

        // Round Champion
        const sorted = [...gameState.inventions].sort((a,b) => b.votes - a.votes);
        gameState.roundWinners.push(sorted[0]);

        triggerConfetti(3);
        soundFanfare();
        gameState.currentView = 'round_reveal';
        render();
      }
    }

    function nextRoundOrFinish() {
      if (gameState.currentRound < gameState.totalRounds) {
        soundFlip();
        gameState.currentRound++;
        dealRoundCards();
        startInventingPhase();
      } else {
        triggerConfetti(5);
        soundFanfare();
        gameState.currentView = 'game_over';
        render();
      }
    }

    function saveToGallery(inv) {
      try {
        soundCash();
        const existing = JSON.parse(localStorage.getItem(STORAGE.GALLERY) || '[]');
        existing.unshift({
          ...inv,
          savedAt: new Date().toLocaleDateString(gameState.language === 'ar' ? 'ar-EG' : 'en-US')
        });
        localStorage.setItem(STORAGE.GALLERY, JSON.stringify(existing));
        alert(gameState.language === 'ar' ? 'اتحفظت الافتكاسة في المعرض بنجاح! ⭐' : 'Saved to Gallery! ⭐');
      } catch (_) {}
    }

            </div>
            <p class="card-text">${isAr ? i1.ar : i1.en}</p>
          </div>

          <div class="game-card card-ingredient">
            <div class="card-header">
              <span class="card-badge">${i2.icon} ${isAr ? 'المكون الإجباري 2' : 'Ingredient #2'}</span>

          <button class="btn btn-primary btn-block" onclick="submitPlayerInvention()" style="padding:16px; font-size:16px;">

              : (isAr ? 'جاهزين للبيع في الاستوديو! 📺' : 'All Set! Start Pitch Mode 📺')}
          </button>
        </div>
      `;
    }

    /* PITCH SCREEN */
    function renderPitch(isAr) {
      const inv = gameState.inventions[gameState.activePitchIndex];
      const isLast = gameState.activePitchIndex === gameState.inventions.length - 1;

      return `
        <div class="pitch-stage">
          <div class="live-badge">
            <span class="live-dot"></span>
            ${isAr ? 'بث مباشر · ستوديو التسوق المنزلي' : 'LIVE ON AIR · TV Shopping Channel'}
          </div>

          <div style="font-size:14px; font-weight:800; color:var(--text-muted); margin-bottom:4px;">
            ${isAr ? 'على الهواء مباشرة المخترع والبائع:' : 'Pitching live on air:'}
          </div>
          <h1 style="font-size:32px; font-weight:900;">
            ${inv.playerAvatar} ${inv.playerName}
          </h1>

          <div style="margin:16px 0;">
            <div class="timer-badge" id="pitchTimerText">${gameState.pitchTimer}s</div>
            <div style="margin-top:8px;">
              <button class="btn btn-secondary" onclick="startPitchTimer()" style="padding:6px 14px; font-size:12px;">
                ▶ ${isAr ? 'شغل العداد' : 'Start Timer'}
              </button>
            </div>
          </div>

          <!-- Teleprompter Cue Card -->
          <div class="cue-card">
            <div style="font-size:12px; font-weight:800; color:var(--primary); text-transform:uppercase;">
              ${isAr ? 'المنتج المعروض للبيع حالياً' : 'Featured Contraption'}
            </div>
            <h2 class="cue-title">«${inv.name}»</h2>
            <div class="cue-slogan">"${inv.slogan}"</div>
            <div class="cue-price">💰 ${isAr ? 'السعر الصادم:' : 'Price:'} <strong>${inv.price}</strong></div>
            <p style="font-size:14px; color:var(--text-muted); line-height:1.6;">${inv.features}</p>
          </div>

          <!-- Audience Soundboard -->
          <div style="font-size:12px; font-weight:800; color:var(--text-muted); margin-bottom:8px;">
            📢 ${isAr ? 'لوحة المؤثرات الصوتية للعيلة أثناء البيع:' : 'Live Soundboard for Audience:'}
          </div>
          <div class="soundboard">
            <button class="sound-btn" onclick="soundApplause()">👏 ${isAr ? 'تصفيق حار' : 'Applause'}</button>
            <button class="sound-btn" onclick="soundCash()">💰 ${isAr ? 'كاشير فلوس' : 'Cha-ching'}</button>
            <button class="sound-btn" onclick="soundGong()">🔔 ${isAr ? 'جرس تنبيه' : 'Bell Ring'}</button>
            <button class="sound-btn" onclick="soundBoing()">🤣 ${isAr ? 'زامور الضحك' : 'Boing!'}</button>
          </div>

          <div style="margin-top:24px;">
            <button class="btn btn-primary" onclick="nextPitcher()" style="padding:14px 28px; font-size:16px;">
              ${isLast 
                ? (isAr ? 'خلصنا البيع.. نروح لصندوق الانتخابات! 🗳️' : 'All Pitches Done! Go to Voting 🗳️')
                : (isAr ? 'المخترع اللي بعده 👉' : 'Next Pitcher 👉')}
            </button>
          </div>
        </div>
      `;
    }

    /* VOTING SCREEN */
    function renderVoting(isAr) {
      const curVoter = gameState.players[gameState.activeVoterIndex];

      const cardsHtml = gameState.inventions.map(inv => {
        const isSelf = inv.playerId === curVoter.id;
        const isSelected = gameState.selectedVoteId === inv.id;

        return `
          <div class="vote-card ${isSelf ? 'disabled' : ''} ${isSelected ? 'selected' : ''}" 
               onclick="${isSelf ? '' : `selectVote('${inv.id}')`}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:24px;">${inv.playerAvatar}</span>
                <div>
                  <div style="font-size:11px; color:var(--text-muted); font-weight:700;">${inv.playerName}</div>
                  <div style="font-size:16px; font-weight:900;">«${inv.name}»</div>
                </div>
              </div>
              ${isSelf ? `
                <span style="font-size:10px; font-weight:800; background:var(--bg-subtle); padding:2px 8px; border-radius:6px;">
                  ${isAr ? 'اختراعك' : 'Yours'}
                </span>
              ` : isSelected ? `
                <span style="font-size:18px;">✅</span>
              ` : ''}
            </div>

            <p style="font-size:13px; font-style:italic; color:var(--text-muted); margin:8px 0;">"${inv.slogan}"</p>
            <div style="font-size:12px; font-weight:800; color:var(--teal);">💰 ${inv.price}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="box">
          <div class="text-center mb-4">
            <div class="hero-kicker">🗳️ ${isAr ? 'صندوق الانتخابات العائلية' : 'Secret Ballot'}</div>
            <h1 style="font-size:28px; font-weight:900;">${isAr ? 'صوت لأحسن وأشطر افتكاسة' : 'Vote for the Best Pitch!'}</h1>
            <p style="color:var(--text-muted); font-size:14px;">
              ${isAr ? `مين بيصوت دلوقتي: ${curVoter.avatar} ${curVoter.name} (ممنوع تصوت لنفسك!)` : `Currently voting: ${curVoter.name} (no self-voting!)`}
            </p>
          </div>

          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; margin:20px 0;">
            ${cardsHtml}
          </div>

          <button class="btn btn-primary btn-block" onclick="castVote()" style="padding:16px; font-size:16px;">
            ${gameState.activeVoterIndex < gameState.players.length - 1
              ? (isAr ? 'اعتمد صوتي وسلم للي بعده 🗳️' : 'Cast Vote & Pass Device 🗳️')
              : (isAr ? 'اعتماد آخر صوت وكشف البطل! 🏆' : 'Final Vote & Reveal Champion! 🏆')}
          </button>
        </div>
      `;
    }

    function selectVote(id) {
      soundBoing();
      gameState.selectedVoteId = id;
      render();
    }

    /* ROUND REVEAL SCREEN */
    function renderRoundReveal(isAr) {
      const sorted = [...gameState.inventions].sort((a,b) => b.votes - a.votes);
      const winner = sorted[0];
      const isFinal = gameState.currentRound >= gameState.totalRounds;

      const standingsHtml = [...gameState.players].sort((a,b) => b.score - a.score).map((p, idx) => `
        <div class="player-row">
          <div class="player-info">
            <span style="font-weight:900; color:var(--text-light); width:20px;">#${idx+1}</span>
            <span style="font-size:22px;">${p.avatar}</span>
            <span style="font-weight:800;">${p.name}</span>
          </div>
          <div style="font-weight:900; color:var(--primary); font-size:16px;">
            ${p.score} ${isAr ? 'نقط' : 'pts'}
          </div>
        </div>
      `).join('');

      return `
        <div class="box text-center">
          <div class="hero-kicker">🏆 ${isAr ? 'بطل الجولة دي هو:' : 'Round Champion'}</div>
          <h1 style="font-size:36px; font-weight:900; margin:8px 0;">
            ${winner.playerAvatar} ${winner.playerName}
          </h1>
          <p style="color:var(--text-muted); font-size:14px; margin-bottom:16px;">
            ${isAr ? `كسب قلوب العيلة بـ ${winner.votes} أصوات!` : `Won family hearts with ${winner.votes} votes!`}
          </p>

          <div class="cue-card" style="max-width:480px; margin:0 auto 20px;">
            <h2 style="font-size:24px; font-weight:900;">«${winner.name}»</h2>
            <div class="cue-slogan">"${winner.slogan}"</div>
            <div class="cue-price">💰 ${winner.price}</div>
          </div>

          <div style="display:flex; justify-content:center; gap:8px; margin-bottom:24px;">
            <button class="btn btn-secondary" onclick='saveToGallery(${JSON.stringify(winner)})'>
              💾 ${isAr ? 'احفظ الاختراع في المعرض' : 'Save to Gallery'}
            </button>
          </div>

          <h3 style="font-size:16px; font-weight:900; margin-bottom:12px; text-align:start;">
            📊 ${isAr ? 'جدول ترتيب الحريفة حتى الآن:' : 'Current Standings:'}
          </h3>
          <div>${standingsHtml}</div>

          <button class="btn btn-primary btn-block mt-4" onclick="nextRoundOrFinish()" style="padding:16px; font-size:16px;">
            ${isFinal 
              ? (isAr ? 'شوف النتيجة النهائية وتتويج الملك! 👑' : 'View Tournament Results! 👑')
              : (isAr ? 'الجولة اللي بعدها 🚀' : 'Next Round 🚀')}
          </button>
        </div>
      `;
    }

    /* GAME OVER SCREEN */
    function renderGameOver(isAr) {
      const ranked = [...gameState.players].sort((a,b) => b.score - a.score);
      const champion = ranked[0];

      return `
        <div class="box text-center">
          <div class="hero-kicker">👑 ${isAr ? 'ملك الفتاكة والاختراعات بلا منازع' : 'Grand Tournament Champion'}</div>
          <h1 style="font-size:42px; font-weight:900; margin:10px 0;">
            ${champion.avatar} ${champion.name}
          </h1>
          <p style="color:var(--text-muted); font-size:16px;">
            ${isAr ? `تُوّج بطلاً للبطولة بمجموع ${champion.score} نقطة!` : `Crowned champion with ${champion.score} points!`}
          </p>

          <!-- Podium -->
          <div class="podium">
            ${ranked[1] ? `
              <div class="podium-step">
                <div style="font-size:32px;">${ranked[1].avatar}</div>
                <div style="font-weight:800; font-size:13px; margin:4px 0;">${ranked[1].name}</div>
                <div class="podium-box step-2">
                  <span>🥈 2nd</span>
                  <span style="font-size:12px;">${ranked[1].score} pts</span>
                </div>
              </div>
            ` : ''}

            <div class="podium-step">
              <div style="font-size:44px;">${champion.avatar}</div>
              <div style="font-weight:900; font-size:15px; margin:4px 0;">${champion.name}</div>
              <div class="podium-box step-1">
                <span>🥇 1st</span>
                <span style="font-size:13px;">${champion.score} pts</span>
              </div>
            </div>

            ${ranked[2] ? `
              <div class="podium-step">
                <div style="font-size:32px;">${ranked[2].avatar}</div>
                <div style="font-weight:800; font-size:13px; margin:4px 0;">${ranked[2].name}</div>
                <div class="podium-box step-3">
                  <span>🥉 3rd</span>
                  <span style="font-size:12px;">${ranked[2].score} pts</span>
                </div>
              </div>
            ` : ''}
          </div>

          <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:24px;">
            <button class="btn btn-primary" onclick="startNewGame()">
              🔄 ${isAr ? 'العب تاني بنفس اللمة' : 'Rematch (Same Players)'}
            </button>
            <button class="btn btn-secondary" onclick="navigateTo('lobby')">
              👥 ${isAr ? 'لعبة جديدة ولاعبين جداد' : 'New Game (Change Players)'}
            </button>
            <button class="btn btn-secondary" onclick="navigateTo('gallery')">
              🏆 ${isAr ? 'معرض الافتكاسات' : 'View Gallery'}
            </button>
          </div>
        </div>
      `;
    }

    /* GALLERY */
    function renderGallery(isAr) {
      let items = [];
      try {
        items = JSON.parse(localStorage.getItem(STORAGE.GALLERY) || '[]');
      } catch (_) {}

      let itemsHtml = items.map((inv, idx) => `
        <div class="box" style="margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-size:28px;">${inv.playerAvatar || '💡'}</span>
              <div>
                <div style="font-size:11px; color:var(--text-muted); font-weight:700;">${inv.playerName} · ${inv.savedAt}</div>
                <h3 style="font-size:18px; font-weight:900;">«${inv.name}»</h3>
              </div>
            </div>
            <button class="del-btn" onclick="deleteGalleryItem(${idx})">🗑️</button>
          </div>
          <div style="font-style:italic; color:var(--primary); font-weight:700; margin:8px 0;">"${inv.slogan}"</div>
          <div style="font-size:13px; font-weight:800; color:var(--teal);">💰 ${inv.price}</div>
        </div>
      `).join('');

      return `
        <div class="box">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h1 style="font-size:26px; font-weight:900;">🏆 ${isAr ? 'معرض افتكاسات العيلة' : 'Invention Gallery'}</h1>
            ${items.length > 0 ? `
              <button class="btn btn-secondary" onclick="clearGallery()" style="padding:6px 12px; font-size:12px; color:var(--rose);">
                ${isAr ? 'تفريغ المعرض' : 'Clear All'}
              </button>
            ` : ''}
          </div>

          ${items.length === 0 ? `
            <div class="text-center" style="padding:40px 16px;">
              <div style="font-size:40px; margin-bottom:12px;">💡</div>
              <h3 style="font-size:18px; font-weight:900;">${isAr ? 'المعرض لسه فاضي..' : 'Gallery is Empty'}</h3>
              <p style="color:var(--text-muted); font-size:13px; margin:6px 0 16px;">
                ${isAr ? 'العبوا جولة واحفظوا أحلى افتكاسات عشان تلاقوها هنا دايماً!' : 'Play a game and save your favorite inventions here!'}
              </p>
              <button class="btn btn-primary" onclick="navigateTo('lobby')">${isAr ? 'يلا نلعب!' : 'Play Now!'}</button>
            </div>
          ` : `
            <div>${itemsHtml}</div>
          `}
        </div>
      `;
    }

    function deleteGalleryItem(idx) {
      soundFlip();
      const items = JSON.parse(localStorage.getItem(STORAGE.GALLERY) || '[]');
      items.splice(idx, 1);
      localStorage.setItem(STORAGE.GALLERY, JSON.stringify(items));
      render();
    }

    function clearGallery() {
      if (confirm(gameState.language === 'ar' ? 'تأكيد مسح المعرض؟' : 'Clear all items?')) {
        soundBoing();
        localStorage.removeItem(STORAGE.GALLERY);
        render();
      }
    }

    /* CUSTOM CARDS */
    function renderCustomCards(isAr) {
      let customP = JSON.parse(localStorage.getItem(STORAGE.CUSTOM_PROBLEMS) || '[]');
      let customI = JSON.parse(localStorage.getItem(STORAGE.CUSTOM_INGREDIENTS) || '[]');

      return `
        <div class="box">
          <h1 style="font-size:26px; font-weight:900; margin-bottom:6px;">✨ ${isAr ? 'كروت ومقالب العيلة الخاصة' : 'Custom Cards'}</h1>
          <p style="color:var(--text-muted); font-size:13px; margin-bottom:20px;">
            ${isAr ? 'ضيفوا مشاكل من بيتكم ومكونات مجنونة عشان اللعب يبقى شخصي وموت من الضحك!' : 'Add your own family problems and ingredients!'}
          </p>

          <div style="display:grid; grid-template-columns:1fr; gap:20px;">
            <!-- Add Problem -->
            <div style="padding:16px; border-radius:12px; background:var(--bg-subtle);">
              <h3 style="font-size:16px; font-weight:900; margin-bottom:10px;">⚠️ ${isAr ? 'إضافة كارت ورطة جديدة' : 'Add Problem Card'}</h3>
              <div style="display:flex; gap:8px;">
                <input type="text" id="customProblemInput" placeholder="${isAr ? 'مثلاً: بابا بينام قدام نشرة الأخبار ويقول: أنا سامع!' : 'e.g., Dad sleeps during the news!'}" class="form-input" />
                <button class="btn btn-primary" onclick="addCustomCard('problem')">${isAr ? 'حفظ' : 'Save'}</button>
              </div>
            </div>

            <!-- Add Ingredient -->
            <div style="padding:16px; border-radius:12px; background:var(--bg-subtle);">
              <h3 style="font-size:16px; font-weight:900; margin-bottom:10px;">🧪 ${isAr ? 'إضافة كارت مكون عجيب' : 'Add Ingredient Card'}</h3>
              <div style="display:flex; gap:8px;">
                <input type="text" id="customIngredientInput" placeholder="${isAr ? 'مثلاً: فردة شراب صوف ومعاها بطارية ريموت فاضية' : 'e.g., Old woolen sock with a dead battery'}" class="form-input" />
                <button class="btn btn-primary" onclick="addCustomCard('ingredient')">${isAr ? 'حفظ' : 'Save'}</button>
              </div>
            </div>
          </div>

          <!-- Existing List -->
          <div class="mt-4">
            <h3 style="font-size:16px; font-weight:900; margin-bottom:10px;">📋 ${isAr ? 'الكروت المضافة حالياً:' : 'Your Custom Cards:'}</h3>
            ${customP.length === 0 && customI.length === 0 ? `
              <div style="font-size:12px; color:var(--text-muted);">${isAr ? 'لسه ما ضيفتوش كروت مخصصة.. ضيفوا أول كارت فوق!' : 'No custom cards yet.'}</div>
            ` : `
              <div style="display:grid; gap:8px;">
                ${customP.map((c, i) => `
                  <div class="player-row">
                    <span>⚠️ ${c.ar}</span>
                    <button class="del-btn" onclick="deleteCustomCard('problem', ${i})">🗑️</button>
                  </div>
                `).join('')}
                ${customI.map((c, i) => `
                  <div class="player-row">
                    <span>🧪 ${c.ar}</span>
                    <button class="del-btn" onclick="deleteCustomCard('ingredient', ${i})">🗑️</button>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function addCustomCard(type) {
      soundCash();
      if (type === 'problem') {
        const input = document.getElementById('customProblemInput');
        if (!input || !input.value.trim()) return;
        const list = JSON.parse(localStorage.getItem(STORAGE.CUSTOM_PROBLEMS) || '[]');
        list.push({ id: 'cp_' + Date.now(), ar: input.value.trim(), en: input.value.trim(), icon: '⚠️' });
        localStorage.setItem(STORAGE.CUSTOM_PROBLEMS, JSON.stringify(list));
      } else {
        const input = document.getElementById('customIngredientInput');
        if (!input || !input.value.trim()) return;
        const list = JSON.parse(localStorage.getItem(STORAGE.CUSTOM_INGREDIENTS) || '[]');
        list.push({ id: 'ci_' + Date.now(), ar: input.value.trim(), en: input.value.trim(), icon: '🧪' });
        localStorage.setItem(STORAGE.CUSTOM_INGREDIENTS, JSON.stringify(list));
      }
      render();
    }

    function deleteCustomCard(type, index) {
      soundFlip();
      const key = type === 'problem' ? STORAGE.CUSTOM_PROBLEMS : STORAGE.CUSTOM_INGREDIENTS;
      const list = JSON.parse(localStorage.getItem(key) || '[]');
      list.splice(index, 1);
      localStorage.setItem(key, JSON.stringify(list));
      render();
    }

    /* RULES & SECRETS GUIDE */
    function renderRules(isAr) {
      return `
        <div class="box">
          <h1 style="font-size:28px; font-weight:900; margin-bottom:12px;">📖 ${isAr ? 'كتالوج اللعبة وأسرار بياع التلفزيون' : 'Rules & Pitch Secrets'}</h1>

          <div style="line-height:1.8; color:var(--text-muted); font-size:14px; margin-bottom:24px;">
            ${isAr ? `
              <p>🎯 <strong>الهدف:</strong> تجمع أكبر عدد من أصوات العيلة عن طريق اختراع أغرب منتج وحبكه بإقناع كوميدي زي بياعين قنوات الإعلانات!</p>
              <p>👥 <strong>اللاعبين:</strong> من 3 لـ 8 لاعبين على شاشة واحدة (موبايل، تابلت، أو تلفزيون).</p>
              <p>⏱️ <strong>الوقت:</strong> 60 ثانية لكل لاعب لتجهيز الافتكاسة، ثم كل واحد بيطلع في الاستوديو يبيع اختراعه!</p>
            ` : `
              <p>🎯 <strong>Goal:</strong> Pitch hilarious contraptions to solve wacky problems and win family votes!</p>
              <p>👥 <strong>Players:</strong> 3 to 8 players on a single shared screen or phone.</p>
              <p>⏱️ <strong>Time:</strong> 60 seconds to invent, then pitch out loud live!</p>
            `}
          </div>

          <h2 style="font-size:20px; font-weight:900; margin-bottom:12px; color:var(--primary);">
            🔥 ${isAr ? 'أسرار بياع التلفزيون المحترف:' : 'TV Pitch Secrets:'}
          </h2>

          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px;">
            <div style="padding:14px; border-radius:12px; background:var(--bg-subtle);">
              <h4 style="font-weight:900; font-size:14px; color:var(--text-main); margin-bottom:4px;">${isAr ? '1. جملة البداية الصادمة' : '1. The Shock Hook'}</h4>
              <p style="font-size:12px; color:var(--text-muted);">${isAr ? 'ابدأ بصوت عالي: «يا مدام! زهقتي من كراكيب الصالة؟ الحل السحري وصل أخيراً!»' : 'Open loud: "Ladies and gentlemen, are you tired of..."'}</p>
            </div>

            <div style="padding:14px; border-radius:12px; background:var(--bg-subtle);">
              <h4 style="font-weight:900; font-size:14px; color:var(--text-main); margin-bottom:4px;">${isAr ? '2. الخصم الوهمي' : '2. The Fake Limited Deal'}</h4>
              <p style="font-size:12px; color:var(--text-muted);">${isAr ? '«المنتج ده بمليون جنيه في الساحل.. لكن لأول 3 هيصوتوا لي: بـ 99 جنيه وشكراً!»' : '"Normally $1,000,000, but today only $19.99 for the first 3!"'}</p>
            </div>

            <div style="padding:14px; border-radius:12px; background:var(--bg-subtle);">
              <h4 style="font-weight:900; font-size:14px; color:var(--text-main); margin-bottom:4px;">${isAr ? '3. الميزة الخيالية' : '3. The Miracle Feature'}</h4>
              <p style="font-size:12px; color:var(--text-muted);">${isAr ? '«الموزة اللي في الاختراع مش للأكل.. دي شريحة ذكاء اصطناعي بتنور في الضلمة!»' : '"The banana acts as a quantum GPS sensor!"'}</p>
            </div>

            <div style="padding:14px; border-radius:12px; background:var(--bg-subtle);">
              <h4 style="font-weight:900; font-size:14px; color:var(--text-main); margin-bottom:4px;">${isAr ? '4. الضمان الأبدي' : '4. The Golden Guarantee'}</h4>
              <p style="font-size:12px; color:var(--text-muted);">${isAr ? '«لو المنتج منفّعكش.. هرجعلك فلوسك وهعملك شاي بلبن بإيدي!»' : '"100% satisfaction or your money back!"'}</p>
            </div>
          </div>

          <button class="btn btn-primary btn-block mt-4" onclick="navigateTo('lobby')" style="padding:14px;">
            🚀 ${isAr ? 'فهمنا كل حاجة.. يلا نلعب!' : 'Got it.. Let’s Play!'}
          </button>
        </div>
      `;
    }

    /* =====================================================================
       8. INITIAL BOOTSTRAP ON LOAD
       ===================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      // Check system dark mode preference
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        toggleTheme();
      }
      render();
    });
  </script>
</body>
</html>
